<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b2d">
<title>NEAL | Logo Animation Preview</title>
<style>
:root{color-scheme:dark;--cyan:#49d5e8;--blue:#168cba;--white:#f4fbff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:var(--white);background:radial-gradient(ellipse at 50% 43%,#123b57 0%,#0a263d 38%,#061523 78%,#030b13 100%)}
.scene{position:relative;width:min(100%,900px);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;isolation:isolate}
.aurora{position:absolute;width:min(78vw,610px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(27,174,205,.17),rgba(22,140,186,.07) 42%,transparent 70%);filter:blur(9px);animation:aurora 4.5s ease-in-out infinite alternate;z-index:-2}
.grid{position:absolute;inset:0;opacity:.12;z-index:-3;background-image:linear-gradient(rgba(105,207,231,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(105,207,231,.16) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse at center,#000 5%,transparent 76%)}
.content{width:100%;display:flex;align-items:center;flex-direction:column;text-align:center;transform:translateY(10px);animation:arrive 1s cubic-bezier(.2,.8,.2,1) both}
.logo-wrap{width:clamp(190px,32vw,280px);aspect-ratio:1;position:relative;display:grid;place-items:center;margin-bottom:24px}
.logo-wrap:before,.logo-wrap:after{content:"";position:absolute;border-radius:50%;inset:5%;border:1px solid rgba(73,213,232,.34);animation:orbit 7s linear infinite}
.logo-wrap:after{inset:-4%;border-color:rgba(73,213,232,.13);border-style:dashed;animation:orbit 18s linear infinite reverse}
.logo{display:block;position:relative;width:77%;height:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(73,213,232,.22));animation:logoIn 1.45s cubic-bezier(.16,1,.3,1) both, float 3.6s ease-in-out 1.45s infinite}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 17px 5px rgba(73,213,232,.35)}
.s1{top:14%;right:19%;animation:twinkle 2.1s infinite}
.s2{bottom:20%;left:14%;width:5px;height:5px;animation:twinkle 2.7s .4s infinite}
.s3{top:37%;left:7%;width:4px;height:4px;animation:twinkle 1.8s .8s infinite}
h1{font-size:clamp(27px,5vw,42px);font-weight:700;letter-spacing:2px;margin:0 0 10px;background:linear-gradient(90deg,#fff 15%,#8be9f1 50%,#fff 85%);background-size:200% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shine 4s linear infinite}
.subtitle{font-size:clamp(12px,2vw,15px);letter-spacing:3px;color:#a9d2e2;margin:0 0 28px;direction:ltr}
.tagline{font-size:14px;color:#d3e9f2;margin:0 0 30px;opacity:0;animation:fadeUp .8s .7s ease forwards}
.loader{width:min(260px,68vw);height:3px;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden}
.loader span{display:block;width:38%;height:100%;border-radius:10px;background:linear-gradient(90deg,transparent,var(--cyan),#fff);box-shadow:0 0 12px var(--cyan);animation:loading 2.6s ease-in-out infinite}
.footer{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(198,226,238,.48);font-size:11px;letter-spacing:.5px}
@keyframes arrive{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(10px)}}
@keyframes logoIn{0%{opacity:0;transform:scale(.35) rotate(-18deg);filter:blur(8px) drop-shadow(0 0 0 transparent)}65%{opacity:1;transform:scale(1.06) rotate(3deg)}100%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 18px rgba(73,213,232,.22))}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes shine{to{background-position:200% center}}
@keyframes loading{0%{transform:translateX(260%)}100%{transform:translateX(-300%)}}
@keyframes aurora{from{transform:scale(.88);opacity:.65}to{transform:scale(1.12);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="scene">
  <div class="grid" aria-hidden="true"></div><div class="aurora" aria-hidden="true"></div>
  <section class="content" aria-label="پیش‌نمایش انیمیشن لوگوی نئال">
    <div class="logo-wrap">
      <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
      <img class="logo" src="images/logo.png" alt="لوگوی شرکت نئال فارمد">
    </div>
    <h1>NEAL PHARMED</h1>
    <p class="subtitle">NEAL PROXY MANAGER</p>
    <p class="tagline">سامانه مدیریت و دسترسی امن شبکه</p>
    <div class="loader" role="presentation"><span></span></div>
  </section>
  <footer class="footer">NEAL Pharmed Pharmaceutical Company</footer>
</main>
</body>
</html>
